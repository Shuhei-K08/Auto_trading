name: 銘柄選定スキャン（月2回）

on:
  # 毎月 1日・15日の 9:00 JST（UTC 0:00）に実行
  schedule:
    - cron: '0 0 1,15 * *'   # UTC 0:00 = JST 9:00（1日・15日）
  # 手動実行ボタン
  workflow_dispatch:
    inputs:
      trading_mode:
        description: '取引モード (advisor=アドバイスのみ / demo=デモ取引)'
        required: false
        default: 'advisor'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-watchlist-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run watchlist scan (one-shot)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: ${{ github.event.inputs.trading_mode || 'advisor' }}
          PORTFOLIO_VALUE: ${{ secrets.PORTFOLIO_VALUE || '1000000' }}
          LOG_LEVEL: 'info'
        run: |
          mkdir -p logs
          node scan-watchlist.js

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-scan-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
